name: Validate skill and evidence reports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check report boundaries
        run: python -m unittest discover -s tests -v
      - name: Check example report
        run: python paper-detective/scripts/validate_report.py examples/synthetic-report.json
      - name: Check skill package
        run: python tests/check_package.py
